      padding: 13px 10px;

      font-size: 14px;

    /* ===== STATUS DOT ===== */

      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .selected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .not-selected {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }


    /* ===== LOADING ===== */

    .message {

      padding: 30px;
      font-size: 16px;

    .member-column {

    }

    .member {

      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #555;

      border-bottom: none;

  <!-- =========================
         JAVASCRIPT
    ========================== -->


  <script>
    const roundFiles = {

      round0: "assets/results/coc_round_0.json",

      round1: "assets/results/coc_round_1.json",

      phase1: "assets/results/coc_round_2_phase_1.json",

      phase2: "assets/results/coc_round_2_phase_2.json",

      phase3: "assets/results/coc_round_2_phase_3.json"

    };




    function loadRound(round, button) {

      console.log("Selected round:", round);
      document.querySelectorAll(".round-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      const file = roundFiles[round];

      console.log("Trying to load:", file);

      if (!file) {
        console.error("Invalid round:", round);
        return;
      }

      fetch(file)
        .then(response => {

          console.log("Response:", response);
          console.log("Status:", response.status);

          if (!response.ok) {
            throw new Error(
              `Failed to load ${file} - HTTP ${response.status}`
            );
          }

          return response.json();
        })

        .then(data => {

          console.log("JSON loaded successfully:");
          console.log(data);

          if (!Array.isArray(data)) {
            throw new Error("JSON is not an array");
          }

          if (round === "round0") {
            generateRound0Table(data);

          } else if (round === "phase3") {
            generatePhase3Table(data);

          } else {
            generateOtherRoundTable(data);
          }
        })

        .catch(error => {

          console.error("FULL ERROR:", error);

          alert("Unable to load data. Check Console (F12).");

        });
    }


    function generateRound0Table(data) {

      const tableHead = document.getElementById("tableHead");
      const tableBody = document.getElementById("resultsBody");


      // Clear old table
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";


      // -------------------------
      // HEADER
      // -------------------------

      const headerRow = document.createElement("tr");

      headerRow.innerHTML = `
        <th>SNO</th>
        <th>Team Name</th>
        <th>Team Leader</th>
        <th>Roll Number</th>
        <th>Year of Study</th>
        <th>Department</th>
        <th>Status</th>
        <th>Cumulative Marks</th>
    `;

      tableHead.appendChild(headerRow);


      // -------------------------
      // BODY
      // -------------------------

      data.forEach(team => {

        const row = document.createElement("tr");


        // Status dot

        const status =
          team["Team Status"]?.toLowerCase() === "selected";


        const statusHTML = `
    <span class="status-dot ${status ? "selected" : "not-selected"}"></span>
    ${team["Team Status"]}
`;


        row.innerHTML = `

            <td>
                ${team["SNO"]}
            </td>

            <td>
                ${team["Team Name"]}
            </td>

            <td>
                ${team["Team Leader Name"]}
            </td>

            <td>
                ${team["Team Leader Roll Number"]}
            </td>

            <td>
                ${team["Team Leader Year of Study"]}
            </td>

            <td>
                ${team["Team Department"]}
            </td>

            <td>
                ${statusHTML}
            </td>

            <td>
                ${team["Cumulative Marks"]}
            </td>

        `;


        tableBody.appendChild(row);

      });

    }
    function generateOtherRoundTable(data) {

      const tableHead = document.getElementById("tableHead");
      const tableBody = document.getElementById("resultsBody");


      // Clear previous table
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";


      // -------------------------
      // HEADER
      // -------------------------

      const headerRow = document.createElement("tr");

      headerRow.innerHTML = `
        <th>SNO</th>
        <th>Team Name</th>
        <th>Team Members</th>
        <th>Roll No</th>
        <th>Department</th>
        <th>Year of Study</th>
        <th>Lands Conquored</th>
    `;

      tableHead.appendChild(headerRow);


      // -------------------------
      // BODY
      // -------------------------

      data.forEach(team => {

        const row = document.createElement("tr");


        // Create member lists

        const members = team["Team Members"] || [];
        const rollNumbers = team["Roll No"] || [];
        const departments = team["Department"] || [];
        const years = team["Year of Study"] || [];


        // Generate members HTML

        const membersHTML = members
          .map(member => `<div class="member">${member}</div>`)
          .join("");


        // Generate roll number HTML

        const rollHTML = rollNumbers
          .map(roll => `<div class="member">${roll}</div>`)
          .join("");


        // Generate department HTML

        const deptHTML = departments
          .map(dept => `<div class="member">${dept}</div>`)
          .join("");


        // Generate year HTML

        const yearHTML = years
          .map(year => `<div class="member">${year}</div>`)
          .join("");


        row.innerHTML = `

            <td>
                ${team["SNO"]}
            </td>

            <td>
                ${team["Team Name"]}
            </td>

            <td class="member-column">
                ${membersHTML}
            </td>

            <td class="member-column">
                ${rollHTML}
            </td>

            <td class="member-column">
                ${deptHTML}
            </td>

            <td class="member-column">
                ${yearHTML}
            </td>

            <td>
                ${team["Lands Conquored"]}
            </td>

        `;


        tableBody.appendChild(row);

      });

    }
    function generatePhase3Table(data) {
    const tableHead = document.getElementById("tableHead");
    const tableBody = document.getElementById("resultsBody");

    tableHead.innerHTML = "";
    tableBody.innerHTML = "";

    // Table Header
    const headerRow = document.createElement("tr");

    headerRow.innerHTML = `
        <th>Rank</th>
        <th>Team Name</th>
        <th>Team Members</th>
        <th>Roll No</th>
        <th>Department</th>
        <th>Year of Study</th>
        <th>Lands Conquered</th>
    `;

    tableHead.appendChild(headerRow);

    // Table Data
    data.forEach(team => {

        const row = document.createElement("tr");

        const members = team["Team Members"] || [];
        const rollNumbers = team["Roll No"] || [];
        const departments = team["Department"] || [];
        const years = team["Year of Study"] || [];

        // Generate 3 separate lines inside each cell
        const membersHTML = members
            .map(member => `<div class="member">${member}</div>`)
            .join("");

        const rollHTML = rollNumbers
            .map(roll => `<div class="member">${roll}</div>`)
            .join("");

        const deptHTML = departments
            .map(dept => `<div class="member">${dept}</div>`)
            .join("");

        const yearHTML = years
            .map(year => `<div class="member">${year}</div>`)
            .join("");

        row.innerHTML = `
            <td>${team["Rank"]}</td>

            <td>${team["Team Name"]}</td>

            <td class="member-column">
                ${membersHTML}
            </td>

            <td class="member-column">
                ${rollHTML}
            </td>

            <td class="member-column">
                ${deptHTML}
            </td>

            <td class="member-column">
                ${yearHTML}
            </td>

            <td>${team["Lands Conquered"]}</td>
        `;

        tableBody.appendChild(row);
    });
}

    // Load Round-0 when page opens

    window.addEventListener("DOMContentLoaded", () => {

      const params = new URLSearchParams(window.location.search);
      const round = params.get("round");

      if (round && roundFiles[round]) {

        const button = document.getElementById(round + "Btn");

        loadRound(round, button);

      } else {

        loadRound(
          "round0",
          document.getElementById("round0Btn")
        );

      }
    });
  </script>
