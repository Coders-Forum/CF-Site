<table class="results-table" style="margin-top: 80px;">
    <thead>
    <tr>
        <th>S.NO</th>
        <th>TEAM NAME</th>
        <th>TEAM LEADER</th>
        <th>ROLL NUMBER</th>
        <th>YEAR</th>
        <th>DEPARTMENT</th>
        <th>LANDS</th>
    </tr>
</thead>

<tbody id="resultsBody"></tbody>
</table>

<script>
   document.addEventListener("DOMContentLoaded", () => {

    const tableBody = document.getElementById("resultsBody");

    fetch("./coc_round_1.json")
        .then(response => {
            if (!response.ok) {
                throw new Error(`Failed to load JSON: ${response.status}`);
            }

            return response.json();
        })

        .then(data => {

    tableBody.innerHTML = "";

    data.forEach(team => {

        const row = document.createElement("tr");

        const conquered = team["Lands Conquored"] !== "No Lands";

        row.innerHTML = `
            <td>${team["SNO"]}</td>
            <td>${team["Team Name"]}</td>
            <td>${team["Team Leader Name"]}</td>
            <td>${team["Team Leader Roll Number"]}</td>
            <td>${team["Team Leader Year of Study"]}</td>
            <td>${team["Team Department"]}</td>

            <td class="land-cell">
                <span class="land-dot ${conquered ? "green-dot" : "red-dot"}"></span>
                ${team["Lands Conquored"]}
            </td>
        `;

        tableBody.appendChild(row);
    });

})

});
</script>
